<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 320px; font: 13px -apple-system, Segoe UI, Roboto, sans-serif; background: #12141c; color: #d1d4dc; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #262a36; }
  header b { color: #00e5ff; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 6px 0; max-height: 320px; overflow: auto; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 14px; }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .st { font-size: 11px; color: #787b86; }
  li .st.err { color: #ef5350; }
  .empty { padding: 14px; color: #787b86; }
  footer { padding: 10px 14px; border-top: 1px solid #262a36; display: flex; gap: 8px; }
  button { flex: 1; background: #1e2230; color: #d1d4dc; border: 1px solid #2f3546; border-radius: 6px; padding: 7px; cursor: pointer; font: inherit; }
  button:hover { border-color: #00e5ff; }
  .switch { position: relative; width: 32px; height: 18px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3546; border-radius: 9px; cursor: pointer; transition: .15s; }
  .switch span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #d1d4dc; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: #00a6bb; }
  .switch input:checked + span::before { transform: translateX(14px); }
</style>
</head>
<body>
  <header><b>PineTS Overlay</b><label class="switch" title="Overlay on/off"><input type="checkbox" id="master"><span></span></label></header>
  <ul id="list"></ul>
  <footer><button id="open">Manage scripts &amp; settings</button></footer>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
